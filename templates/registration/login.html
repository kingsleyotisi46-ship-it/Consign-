{% extends 'base.html' %}

{% block title %}Login - DailyFX Delivery{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Login to DailyFX Delivery</h1>
        {% if form.errors %}
        <div class="bg-red-100 text-red-700 p-4 rounded-lg mb-6">
            Invalid username or password. Please try again.
        </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input id="id_username" type="text" name="username" required autofocus class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input id="id_password" type="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
            </div>
            <button type="submit" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-semibold">Login</button>
        </form>
        <p class="mt-6 text-center text-gray-600">
            Don't have an account?
            <a href="{% url 'register' %}" class="text-blue-700 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
